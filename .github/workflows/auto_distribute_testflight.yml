name: Check Builds Detail
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Check
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          npm install jsonwebtoken
          node -e '
          const jwt = require("jsonwebtoken");
          const now = Math.floor(Date.now() / 1000);
          const token = jwt.sign(
            { iss: process.env.ISSUER_ID, iat: now, exp: now + 1200, aud: "appstoreconnect-v1" },
            process.env.PRIVATE_KEY,
            { algorithm: "ES256", header: { kid: process.env.KEY_ID, typ: "JWT" } }
          );
          async function run() {
            console.log("Checking builds...");
            const res = await fetch("https://api.appstoreconnect.apple.com/v1/builds?filter[app]=6827139713&sort=-uploadedDate&limit=3", {
              headers: { Authorization: "Bearer " + token }
            });
            console.log("Builds response status:", res.status);
            const data = await res.json();
            if (data.data) {
              for (const b of data.data) {
                console.log("BUILD:", b.attributes.version, "STATE:", b.attributes.processingState);
              }
            } else {
              console.log("Builds error body:", JSON.stringify(data));
            }

            console.log("\nChecking certificates (requires PLA accepted)...");
            const certRes = await fetch("https://api.appstoreconnect.apple.com/v1/certificates", {
              headers: { Authorization: "Bearer " + token }
            });
            console.log("Certificates response status:", certRes.status);
            const certData = await certRes.json();
            if (certData.errors) {
              console.log("Certificates ERRORS:", JSON.stringify(certData.errors, null, 2));
            } else {
              console.log("Certificates OK! Total found:", (certData.data || []).length);
            }
          }
          run().catch(console.error);
          '
