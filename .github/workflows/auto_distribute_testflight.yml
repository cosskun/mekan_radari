name: Check Builds Detail
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Check
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          npm install jsonwebtoken
          node -e '
          const jwt = require("jsonwebtoken");
          const now = Math.floor(Date.now() / 1000);
          const token = jwt.sign(
            { iss: process.env.ISSUER_ID, iat: now, exp: now + 1200, aud: "appstoreconnect-v1" },
            process.env.PRIVATE_KEY,
            { algorithm: "ES256", header: { kid: process.env.KEY_ID, typ: "JWT" } }
          );
          async function run() {
            const res = await fetch("https://api.appstoreconnect.apple.com/v1/builds?filter[app]=6827139713&sort=-uploadedDate&limit=5", {
              headers: { Authorization: "Bearer " + token }
            });
            const data = await res.json();
            for (const b of data.data) {
              console.log("BUILD:", b.attributes.version, "STATE:", b.attributes.processingState, "ENC:", b.attributes.usesNonExemptEncryption);
            }
          }
          run().catch(console.error);
          '
