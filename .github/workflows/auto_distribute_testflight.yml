name: Check Beta Group Testers
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Check
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          npm install jsonwebtoken
          node -e '
          const jwt = require("jsonwebtoken");
          const now = Math.floor(Date.now() / 1000);
          const token = jwt.sign(
            { iss: process.env.ISSUER_ID, iat: now, exp: now + 1200, aud: "appstoreconnect-v1" },
            process.env.PRIVATE_KEY,
            { algorithm: "ES256", header: { kid: process.env.KEY_ID, typ: "JWT" } }
          );
          async function run() {
            const res = await fetch("https://api.appstoreconnect.apple.com/v1/betaGroups/2f33955a-c63f-4c30-8c3e-ed30beb17be1/betaTesters", {
              headers: { Authorization: "Bearer " + token }
            });
            const data = await res.json();
            console.log("Group Ben Testers:", JSON.stringify(data, null, 2));

            // Also check app betaTesters
            const appTRes = await fetch("https://api.appstoreconnect.apple.com/v1/apps/6827139713/betaTesters", {
              headers: { Authorization: "Bearer " + token }
            });
            const appTData = await appTRes.json();
            console.log("App Beta Testers:", JSON.stringify(appTData, null, 2));
          }
          run().catch(console.error);
          '
