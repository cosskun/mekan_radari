name: Auto Distribute TestFlight
on:
  workflow_dispatch:

jobs:
  distribute:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run Distribute and Invite
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          npm install jsonwebtoken
          node -e '
          const jwt = require("jsonwebtoken");
          const keyId = process.env.KEY_ID;
          const issuerId = process.env.ISSUER_ID;
          const privateKey = process.env.PRIVATE_KEY;

          function getToken() {
            const now = Math.floor(Date.now() / 1000);
            return jwt.sign(
              { iss: issuerId, iat: now, exp: now + 1200, aud: "appstoreconnect-v1" },
              privateKey,
              { algorithm: "ES256", header: { kid: keyId, typ: "JWT" } }
            );
          }

          async function req(url, options = {}) {
            const token = getToken();
            const headers = Object.assign({
              "Authorization": "Bearer " + token,
              "Accept": "application/json",
              "Content-Type": "application/json"
            }, options.headers || {});
            const res = await fetch(url, Object.assign({}, options, { headers }));
            const text = await res.text();
            try {
              return { status: res.status, ok: res.ok, data: JSON.parse(text) };
            } catch {
              return { status: res.status, ok: res.ok, text };
            }
          }

          async function main() {
            const appId = "6827139713";
            const email = "furkanc28@gmail.com";

            console.log("1. Finding tester:", email);
            const testerRes = await req("https://api.appstoreconnect.apple.com/v1/betaTesters?filter[email]=" + encodeURIComponent(email));
            const testers = testerRes.data.data || [];
            console.log("Found testers:", testers.length);

            if (testers.length > 0) {
              const testerId = testers[0].id;
              console.log("Tester ID:", testerId);

              // Check if tester has app relationship
              console.log("2. Linking tester to app if needed...");
              const linkAppRes = await req("https://api.appstoreconnect.apple.com/v1/betaTesters/" + testerId + "/relationships/apps", {
                method: "POST",
                body: JSON.stringify({
                  data: [{ type: "apps", id: appId }]
                })
              });
              console.log("Link app result:", linkAppRes.status, linkAppRes.ok ? "SUCCESS" : JSON.stringify(linkAppRes.data));

              // Send invitation
              console.log("3. Triggering Beta Tester Invitation...");
              const invRes = await req("https://api.appstoreconnect.apple.com/v1/betaTesterInvitations", {
                method: "POST",
                body: JSON.stringify({
                  data: {
                    type: "betaTesterInvitations",
                    relationships: {
                      betaTester: { data: { type: "betaTesters", id: testerId } },
                      app: { data: { type: "apps", id: appId } }
                    }
                  }
                })
              });
              console.log("Invitation result:", invRes.status, invRes.ok ? "INVITATION SENT!" : JSON.stringify(invRes.data));
            }

            console.log("All done!");
          }

          main().catch(console.error);
          '
